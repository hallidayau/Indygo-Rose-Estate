name: ClipSync APK

on:
  push:
    paths:
      - "clipsync/**"
      - ".github/workflows/clipsync-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ClipSync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSync
          path: clipsync/ClipSync.apk
